[project]
name = "he-goi-y"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DucanhDaniel", email = "ducanh2002add@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
]

[project.scripts]
he-goi-y = "he_goi_y:main"

[build-system]
